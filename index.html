<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS2 Smoke Lineup Guide</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
    }

    header {
      height: 300px;
      background-image: url('images/cs2-logo.jpg');
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid #222;
    }

    header h1 {
      font-size: 42px;
      margin: 0 0 12px 0;
      letter-spacing: 2px;
    }

    header img {
      max-width: none;
      width: 100%;
      border-radius: 12px;
      border: 1px solid #222;
      display: block;
    }

    main {
      padding: 48px 24px;
      max-width: 1000px;
      margin: auto;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    .column {
      background: #151922;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 24px;
    }

    .column h2 {
      margin-top: 0;
      margin-bottom: 20px;
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 18px;
    }

    .ct h2 {
      background: #2b6cff;
      color: #fff;
    }

    .t h2 {
      background: #f5c542;
      color: #000;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin-bottom: 12px;
    }

    a {
      text-decoration: none;
      color: inherit;
      display: block;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #222;
      background: #0f1115;
      transition: background 0.2s, transform 0.1s;
    }

    a:hover {
      background: #1b2130;
      transform: translateY(-1px);
    }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>

<header>
</header>

<main>

      <ul>

        <li><a href="maps/ancient_ct.html">Ancient</a></li>
        <li><a href="maps/overpass_ct.html">Overpass</a></li>
        <li><a href="maps/anubis_ct.html">Anubis</a></li>
      </ul>
    </div>

    <div class="column t">
      <h2>Terrorists</h2>
      <ul>
        <li><a href="maps/dust2_t.html">Dust II</a></li>
        <li><a href="maps/mirage_t.html">Mirage</a></li>
        <li><a href="maps/inferno_t.html">Inferno</a></li>
        <li><a href="maps/nuke_t.html">Nuke</a></li>
        <li><a href="maps/ancient_t.html">Ancient</a></li>
        <li><a href="maps/overpass_t.html">Overpass</a></li>
        <li><a href="maps/anubis_t.html">Anubis</a></li>
      </ul>
    </div>

  </div>
</main>

<footer>

</footer>

</html>
